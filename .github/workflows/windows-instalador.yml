# Instalador de Baudex para Windows.
#
# Uso: GitHub → Actions → "Instalador Windows" → Run workflow.
# Al terminar, en "Artifacts" del run queda:
#   - Baudex-Setup-<versión>.exe  (instalador, se instala sin administrador)
#   - Baudex-windows-<versión>.zip (la misma app sin instalador)
#
# Los .env no están en git. Aquí se crean con valores de producción que NO
# son secretos (dirección del servidor). La llave de la Ops API sí es secreta:
# si existe el secreto OPS_KEY del repositorio se usa; si no, la app funciona
# igual pero no reporta errores a Telegram.
name: Instalador Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión que verá el cliente (vacío = la de pubspec.yaml)'
        required: false
        default: ''
      probar_script:
        description: 'Probar también compilar-windows.bat (lo que usa el CEO en su PC)'
        type: boolean
        default: false
      probar_impresion:
        description: 'Probar el envío directo a la impresora en Windows real (impresora de mentira)'
        type: boolean
        default: false
      impresion_puerto:
        description: 'Impresora de mentira: "archivo" (puerto a archivo) o "tcp" (plan B: puerto RAW 9100 a un escucha local)'
        type: choice
        options:
          - archivo
          - tcp
        default: archivo
      probar_lector:
        description: 'Medir el lector de código de barras en Windows real (teclas del sistema sobre la factura)'
        type: boolean
        default: false
      probar_impresoras:
        description: 'Probar en Windows real agregar, reiniciar, facturar y eliminar impresoras (impresora de mentira)'
        type: boolean
        default: false
      probar_arranque:
        description: 'Medir en Windows real el arranque, el inicio de sesión y la descarga con preferencias sanas, vacías y dañadas'
        type: boolean
        default: false
      arranque_comparar:
        description: 'Arranque: commit anterior para comparar (su carpeta lib). Vacío = solo la versión actual'
        required: false
        default: '60711e4'
      probar_preferencias:
        description: 'Probar en Windows real que las preferencias del equipo no se dañan (matar la app a mitad de escritura)'
        type: boolean
        default: false
      lector_etiqueta:
        description: 'Lector: etiqueta para el log (p. ej. "antes c05b2dd" o "después")'
        required: false
        default: ''

jobs:
  # Mide en un Windows real qué pasa cuando el lector de código de barras
  # escribe en el buscador de la factura. Compila en modo release una app de
  # medición (tool/probes/lector_windows_probe.dart) que abre el formulario
  # real con 3.000 productos en una base temporal y le manda teclas de
  # verdad al sistema (SendInput: 13 dígitos a 1 ms + Enter, como la
  # pistola). En el log, las líneas "MEDICION LECTOR | ..." traen la tabla:
  # llegada de las teclas, código completo, cuadros dibujados (armar/pintar),
  # Enter → línea, y si se pintó la tarjeta "Producto sin registrar" o el
  # código se vio a medias. Para comparar antes/después, lanzar el workflow
  # sobre cada commit con su etiqueta.
  probar-lector:
    if: ${{ inputs.probar_lector }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Crear .env de relleno (igual que compilar-windows.bat)
        shell: pwsh
        run: |
          $c = @(
            'SERVER_IP=baudex.baudity.tech',
            'SERVER_PORT=443',
            'APP_ENV=production',
            'API_TIMEOUT=30000',
            'DEBUG_MODE=false',
            'SHOW_LOGS=false'
          ) -join "`n"
          foreach ($f in '.env', '.env.production', '.env.development', '.env.staging') {
            Set-Content -Path $f -Value $c -NoNewline -Encoding utf8NoBOM
          }

      - run: flutter pub get

      - name: Compilar la app de medición (release)
        shell: pwsh
        run: |
          flutter build windows --release -t tool/probes/lector_windows_probe.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Medir el lector
        shell: pwsh
        run: |
          $exe = 'build\windows\x64\runner\Release\Baudex.exe'
          New-Item -ItemType Directory -Force C:\lector | Out-Null
          $etiqueta = '${{ inputs.lector_etiqueta }}'
          if ([string]::IsNullOrWhiteSpace($etiqueta)) { $etiqueta = "$env:GITHUB_SHA".Substring(0, 7) }
          $fallas = 0
          # Corridas con teclas del sistema y una de respaldo con mensajes
          # directos a la ventana.
          # 'presentaciones': las presentaciones no están en el equipo y el
          # servidor tarda 250 ms (equipo a medio sincronizar). 'lento': cada
          # cuadro cuesta 40 ms de más (equipo sin buena tarjeta gráfica).
          $corridas = @(
            @{ nombre = 'vacia';          lineas = '0';  teclas = 'sendinput';   pres = '0';   cuadro = '0' },
            @{ nombre = '60lineas';       lineas = '60'; teclas = 'sendinput';   pres = '0';   cuadro = '0' },
            @{ nombre = 'presentaciones'; lineas = '0';  teclas = 'sendinput';   pres = '250'; cuadro = '0' },
            @{ nombre = 'lento';          lineas = '60'; teclas = 'sendinput';   pres = '250'; cuadro = '40' },
            @{ nombre = 'mensajes';       lineas = '0';  teclas = 'postmessage'; pres = '0';   cuadro = '0' }
          )
          foreach ($c in $corridas) {
            $salida = "C:\lector\lector-$($c.nombre).txt"
            $env:BAUDEX_PROBE_OUT = $salida
            $env:BAUDEX_PROBE_LABEL = "$etiqueta / $($c.nombre)"
            $env:BAUDEX_PROBE_LINES = $c.lineas
            $env:BAUDEX_PROBE_KEYS = $c.teclas
            $env:BAUDEX_PROBE_PRESENTATIONS_MS = $c.pres
            $env:BAUDEX_PROBE_FRAME_MS = $c.cuadro
            Write-Host "===== Corrida $($c.nombre) (teclas: $($c.teclas)) ====="
            $p = Start-Process -FilePath $exe -PassThru
            if (-not $p.WaitForExit(8 * 60 * 1000)) {
              Write-Host "::error::La app de medición no terminó (corrida $($c.nombre))"
              $p.Kill()
              $fallas++
            }
            if (Test-Path $salida) { Get-Content $salida -Encoding utf8 } else { Write-Host 'MEDICION LECTOR | sin archivo de salida' }
            Write-Host "Código de salida: $($p.ExitCode)"
            # La de respaldo es informativa: no decide el resultado.
            if ($p.ExitCode -ne 0 -and $c.teclas -eq 'sendinput') { $fallas++ }
          }
          if ($fallas -gt 0) {
            Write-Host "::error::El lector no cumple los criterios (ver líneas 'MEDICION LECTOR | RESULTADO')"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: medicion-lector
          path: C:\lector\*.txt
          if-no-files-found: warn

  # Mide en un Windows real, con reloj real, el arranque y el inicio de
  # sesión de la app completa (tool/probes/arranque_windows_probe.dart)
  # contra un servidor de mentira en 127.0.0.1 con 6.000 facturas y 3.000
  # productos, usando los complementos REALES de Windows (preferencias en
  # shared_preferences.json y almacén seguro DPAPI). Cada paso es un
  # arranque del .exe; entre pasos cambia el estado de las preferencias:
  # sanas, dañadas (archivo cortado, como tras un apagón) y vacías.
  # Corre dos veces en paralelo: con el lib actual y con el del commit de
  # "arranque_comparar" (la versión anterior), para comparar. En el log, las líneas
  # "MEDICION ARRANQUE | versión | paso | …" dicen: tiempo a la primera
  # pantalla, si entra directo o pide iniciar sesión, cuánto tarda iniciar
  # sesión, peticiones y registros descargados, trabas de la pantalla,
  # escrituras de preferencias y si el archivo quedó sano o dañado.
  probar-arranque:
    if: ${{ inputs.probar_arranque }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: [actual, anterior]
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      ARRANQUE_VERSION: ${{ matrix.version }}
      ARRANQUE_COMPARAR: ${{ inputs.arranque_comparar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Elegir el lib a medir
        id: lib
        shell: pwsh
        run: |
          $etiqueta = "actual " + "$env:GITHUB_SHA".Substring(0, 7)
          $medir = 'si'
          if ($env:ARRANQUE_VERSION -eq 'anterior') {
            $ref = "$env:ARRANQUE_COMPARAR".Trim()
            if ($ref -notmatch '^[0-9a-fA-F]{7,40}$') {
              Write-Host 'Sin commit para comparar: no se mide la versión anterior.'
              $medir = 'no'
            } else {
              # ¿Esa versión ya tenía la copia protegida de la sesión? De eso
              # depende qué se espera en los pasos de "llave perdida".
              git cat-file -e "${ref}:lib/app/core/storage/value_protector.dart" 2>$null
              $copia = if ($LASTEXITCODE -eq 0) { 'si' } else { 'no' }
              git checkout $ref -- lib
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              # La sonda usa la línea de tiempo del arranque: si esa versión
              # no la traía, se le pone la de ahora (sin instrumentar, pero
              # con las trabas y los cuadros lentos).
              git checkout $env:GITHUB_SHA -- lib/app/core/diagnostics/startup_trace.dart lib/app/core/diagnostics/startup_trace_binding.dart lib/app/core/diagnostics/paint_probe.dart
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $etiqueta = "anterior $ref"
            }
          }
          if (-not $copia) { $copia = 'si' }
          "copia=$copia" >> $env:GITHUB_OUTPUT
          "etiqueta=$etiqueta" >> $env:GITHUB_OUTPUT
          "medir=$medir" >> $env:GITHUB_OUTPUT

      - name: Crear .env de relleno (la medición apunta a 127.0.0.1)
        if: ${{ steps.lib.outputs.medir == 'si' }}
        shell: pwsh
        run: |
          $c = @(
            'SERVER_IP=127.0.0.1',
            'SERVER_PORT=3990',
            'APP_ENV=development',
            'API_TIMEOUT=30000',
            'DEBUG_MODE=false',
            'SHOW_LOGS=false'
          ) -join "`n"
          foreach ($f in '.env', '.env.production', '.env.development', '.env.staging') {
            Set-Content -Path $f -Value $c -NoNewline -Encoding utf8NoBOM
          }

      - if: ${{ steps.lib.outputs.medir == 'si' }}
        run: flutter pub get

      - name: Compilar la app de medición (release)
        if: ${{ steps.lib.outputs.medir == 'si' }}
        shell: pwsh
        run: |
          flutter build windows --release -t tool/probes/arranque_windows_probe.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pantalla como la de una oficina (más píxeles que pintar). Si el
      # equipo de pruebas no deja cambiarla, se mide con la que tenga.
      - name: Resolución de pantalla 1920x1080
        if: ${{ steps.lib.outputs.medir == 'si' }}
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-DisplayResolution

      - name: Medir arranque e inicio de sesión
        if: ${{ steps.lib.outputs.medir == 'si' }}
        shell: pwsh
        env:
          ARRANQUE_ETIQUETA: ${{ steps.lib.outputs.etiqueta }}
          ARRANQUE_CON_COPIA: ${{ steps.lib.outputs.copia }}
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $exe = 'build\windows\x64\runner\Release\Baudex.exe'
          New-Item -ItemType Directory -Force C:\arranque | Out-Null
          $salida = 'C:\arranque\arranque.txt'
          $env:BAUDEX_PROBE_OUT = $salida
          $env:BAUDEX_PROBE_DIR = 'C:\arranque\base'
          $env:BAUDEX_PROBE_LABEL = $env:ARRANQUE_ETIQUETA
          $env:BAUDEX_PROBE_MAX_S = '240'
          # prefs: estado del archivo de preferencias ANTES de abrir.
          # cerrar: 1 = al salir borra el token (el siguiente paso mide el
          # inicio de sesión con los datos ya en el equipo).
          $pasos = @(
            @{ nombre = '01 equipo nuevo: iniciar sesión y descargar todo'; prefs = 'sanas';   cerrar = '0' },
            @{ nombre = '02 sanas: reabrir';                                 prefs = 'sanas';   cerrar = '0' },
            @{ nombre = '03 sanas: reabrir otra vez';                        prefs = 'sanas';   cerrar = '1' },
            @{ nombre = '04 sanas: iniciar sesión';                          prefs = 'sanas';   cerrar = '0' },
            # Tecleo a mano (teclas del sistema a 120 ms): contraseña,
            # buscador de la factura ("500"/"700" + Enter) y Diagnóstico.
            # Líneas "MEDICION TECLEO | …". Criterio: tecla → visible
            # < 50 ms y Enter → campo del nombre con foco < 150 ms.
            @{ nombre = '04a TECLEO sin descarga';                           prefs = 'sanas';   cerrar = '0'; tecleo = '1' },
            @{ nombre = '04b TECLEO versión recién instalada (descargando)'; prefs = 'sanas';   cerrar = '0'; tecleo = '1'; huella = 'nueva'; latencia = '300' },
            @{ nombre = '04c TECLEO sin marcas (descargando)';               prefs = 'vacias';  cerrar = '1'; tecleo = '1'; latencia = '300' },
            @{ nombre = '04d TECLEO iniciar sesión, versión nueva';          prefs = 'sanas';   cerrar = '1'; tecleo = '1'; huella = 'nueva'; latencia = '300' },
            # Arranque sin sesión con el negocio y el correo recordados, que es
            # donde el CEO ve la lentitud: normal y en modo "equipo lento"
            # (app con 2 núcleos y prioridad baja, carga de procesador y de
            # disco al lado, ventana maximizada). Líneas
            # "MEDICION ARRANQUE LENTO | versión | paso | t=… ms | tarea | duró …".
            @{ nombre = '04e LOGIN RECORDADO, equipo normal';                prefs = 'sanas';   cerrar = '1'; tecleo = '1'; latencia = '150' },
            @{ nombre = '04f LOGIN RECORDADO, EQUIPO LENTO (2 núcleos)';     prefs = 'sanas';   cerrar = '1'; tecleo = '1'; latencia = '150'; lento = '1'; nucleos = '2' },
            @{ nombre = '04g LOGIN RECORDADO, EQUIPO MUY LENTO (1 núcleo)';  prefs = 'sanas';   cerrar = '0'; tecleo = '1'; latencia = '150'; lento = '1'; nucleos = '1' },
            @{ nombre = '05 DAÑADAS: reabrir';                               prefs = 'danadas'; cerrar = '0' },
            @{ nombre = '06 tras dañadas: reabrir';                          prefs = 'sanas';   cerrar = '0' },
            @{ nombre = '07 tras dañadas: reabrir otra vez';                 prefs = 'sanas';   cerrar = '1' },
            @{ nombre = '08 DAÑADAS: iniciar sesión';                        prefs = 'danadas'; cerrar = '0' },
            @{ nombre = '09 tras dañadas e iniciar sesión: reabrir';         prefs = 'sanas';   cerrar = '0' },
            @{ nombre = '10 VACÍAS: reabrir';                                prefs = 'vacias';  cerrar = '0' },
            @{ nombre = '11 tras vacías: reabrir';                           prefs = 'sanas';   cerrar = '0' },
            # Cerrar a la fuerza en plena descarga (como apagar el equipo o
            # matar la app): ¿el archivo de preferencias queda dañado?
            @{ nombre = '12 VACÍAS: cierre a la fuerza a los 7 s';           prefs = 'vacias';  cerrar = '0'; matar = 7 },
            @{ nombre = '13 tras cierre a la fuerza: reabrir';               prefs = 'sanas';   cerrar = '0' },
            @{ nombre = '14 VACÍAS: cierre a la fuerza a los 9 s';           prefs = 'vacias';  cerrar = '0'; matar = 9 },
            @{ nombre = '15 tras cierre a la fuerza: reabrir';               prefs = 'sanas';   cerrar = '0' },
            # --- Pasos que se VERIFICAN (el job falla si no se cumplen) ---
            # almacen: antes de arrancar, la app de medición deja el archivo
            # del almacén seguro (flutter_secure_storage.dat) en ceros
            # (apagón), cortado (cierre a mitad de escritura) o borrado. El
            # complemento borra ese archivo cuando no lo puede descifrar.
            # espera: lo que debe pasar con la copia protegida de la sesión.
            # esperaSin: lo que debe pasar en una versión SIN esa copia (si
            # ahí no pide iniciar sesión, el paso no simula el problema).
            @{ nombre = '16 ALMACÉN SEGURO EN CEROS (apagón): reabrir';      prefs = 'sanas';   cerrar = '0'; almacen = 'dat-ceros'; espera = 'directo-copia'; esperaSin = 'login' },
            @{ nombre = '17 tras almacén en ceros: reabrir';                 prefs = 'sanas';   cerrar = '0'; espera = 'directo'; esperaSin = 'directo' },
            # En una versión sin copia este paso SÍ entra directo, y es lo
            # correcto: el paso 16 la dejó en modo preferencias, al iniciar
            # sesión guardó ahí el respaldo `secure_*`, y ese respaldo sigue
            # hasta el segundo arranque; con el archivo borrado (no dañado)
            # el almacén funciona y la sesión se repone desde ese respaldo.
            @{ nombre = '17a ALMACÉN SEGURO BORRADO: reabrir';               prefs = 'sanas';   cerrar = '0'; almacen = 'dat-borrado'; espera = 'directo-copia'; esperaSin = 'directo' },
            @{ nombre = '17b tras almacén borrado: reabrir';                 prefs = 'sanas';   cerrar = '0'; espera = 'directo'; esperaSin = 'directo' },
            @{ nombre = '18 ALMACÉN CORTADO y preferencias DAÑADAS: reabrir'; prefs = 'danadas'; cerrar = '0'; almacen = 'dat-cortado'; espera = 'directo-copia'; esperaSin = 'login' },
            @{ nombre = '19 tras almacén cortado y dañadas: reabrir';        prefs = 'sanas';   cerrar = '1'; espera = 'directo'; esperaSin = 'directo' },
            # Una sesión CERRADA no puede revivir de la copia protegida.
            @{ nombre = '20 SESIÓN CERRADA y ALMACÉN EN CEROS: debe PEDIR login'; prefs = 'sanas'; cerrar = '1'; almacen = 'dat-ceros'; espera = 'login'; esperaSin = 'login' },
            @{ nombre = '21 SESIÓN CERRADA, ALMACÉN CORTADO y preferencias DAÑADAS: debe PEDIR login'; prefs = 'danadas'; cerrar = '1'; almacen = 'dat-cortado'; espera = 'login'; esperaSin = 'login' },
            # Dos negocios en el mismo equipo: tras entrar con B, perder el
            # almacén no puede traer nada de A.
            @{ nombre = '22 negocio B: iniciar sesión';                      prefs = 'sanas';   cerrar = '0'; negocio = 'b'; espera = 'login'; esperaSin = 'login' },
            @{ nombre = '23 negocio B: reabrir';                             prefs = 'sanas';   cerrar = '0'; negocio = 'b'; espera = 'directo'; esperaSin = 'directo' },
            @{ nombre = '24 negocio B y ALMACÉN EN CEROS: debe entrar directo como B'; prefs = 'sanas'; cerrar = '0'; negocio = 'b'; almacen = 'dat-ceros'; espera = 'directo-copia'; esperaSin = 'login' }
          )
          $conCopia = ($env:ARRANQUE_VERSION -ne 'anterior') -or ($env:ARRANQUE_CON_COPIA -eq 'si')
          $fallas = 0
          $colgadas = 0
          foreach ($paso in $pasos) {
            $env:BAUDEX_PROBE_PASO = $paso.nombre
            $env:BAUDEX_PROBE_PREFS = $paso.prefs
            $env:BAUDEX_PROBE_NEGOCIO = if ($paso.negocio) { $paso.negocio } else { 'a' }
            $env:BAUDEX_PROBE_CERRAR_SESION_AL_SALIR = $paso.cerrar
            $env:BAUDEX_PROBE_TECLEO = if ($paso.tecleo) { $paso.tecleo } else { '0' }
            $env:BAUDEX_PROBE_HUELLA = if ($paso.huella) { $paso.huella } else { '' }
            $env:BAUDEX_PROBE_LENTO = if ($paso.lento) { $paso.lento } else { '0' }
            $env:BAUDEX_PROBE_NUCLEOS = if ($paso.nucleos) { $paso.nucleos } else { '2' }
            $env:BAUDEX_PROBE_LATENCIA_MS = if ($paso.latencia) { $paso.latencia } else { '0' }
            $env:BAUDEX_PROBE_T0_MS = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            Write-Host "===== $($paso.nombre) ====="
            $env:BAUDEX_PROBE_ALMACEN = if ($paso.almacen) { $paso.almacen } else { '' }
            $espera = if ($conCopia) { $paso.espera } else { $paso.esperaSin }
            $env:BAUDEX_PROBE_ESPERA = if ($espera) { $espera } else { '' }
            # Arranque normal (entra directo, sin dañar nada) en la versión
            # actual: el archivo del almacén de sesión se lee como mucho 20
            # veces. No aplica a los pasos de tecleo ni a versiones viejas.
            $normal = ($env:ARRANQUE_VERSION -ne 'anterior') -and ($espera -eq 'directo') -and (-not $paso.almacen) -and (-not $paso.tecleo)
            $env:BAUDEX_PROBE_MAX_LECTURAS = if ($normal) { '20' } else { '' }
            $p = Start-Process -FilePath $exe -PassThru
            if ($paso.matar) {
              if (-not $p.WaitForExit($paso.matar * 1000)) { $p.Kill(); $p.WaitForExit() }
              Add-Content -Path $salida -Encoding utf8 -Value "MEDICION ARRANQUE | $env:ARRANQUE_ETIQUETA | $($paso.nombre) | cerrada a la fuerza a los $($paso.matar) s"
            } elseif (-not $p.WaitForExit(8 * 60 * 1000)) {
              Write-Host "::error::La app de medición no terminó ($($paso.nombre))"
              $p.Kill()
              $colgadas++
            }
            Write-Host "Código de salida: $($p.ExitCode)"
            if ($espera -and $p.ExitCode -ne 0) {
              Write-Host "::error::Paso verificado que no cumple: $($paso.nombre) (espera: $espera, código $($p.ExitCode))"
              $fallas++
            }
          }
          Write-Host '===== RESULTADO ====='
          if (Test-Path $salida) { Get-Content $salida -Encoding utf8 } else { Write-Host 'MEDICION ARRANQUE | sin archivo de salida' }
          Write-Host '===== ARRANQUE LENTO ====='
          if (Test-Path $salida) { Get-Content $salida -Encoding utf8 | Select-String 'MEDICION ARRANQUE LENTO' | ForEach-Object { $_.Line } }
          Write-Host '===== SOLO TECLEO ====='
          if (Test-Path $salida) { Get-Content $salida -Encoding utf8 | Select-String 'MEDICION TECLEO' | ForEach-Object { $_.Line } }
          Write-Host '===== PASOS VERIFICADOS ====='
          if (Test-Path $salida) { Get-Content $salida -Encoding utf8 | Select-String -Pattern 'PASO VERIFICADO|almacén seguro|modo de sesión' | ForEach-Object { $_.Line } }
          if ($colgadas -gt 0 -or $fallas -gt 0) {
            Write-Host "::error::Arranque: $colgadas paso(s) colgado(s), $fallas paso(s) verificado(s) que no cumplen"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.lib.outputs.medir == 'si' }}
        with:
          name: medicion-arranque-${{ matrix.version }}
          path: C:\arranque\*.txt
          if-no-files-found: warn

  # Comprueba en un Windows real que el tiquete sale directo por la cola de
  # impresión (windows_raw_printer.dart), sin PowerShell: instala una
  # impresora de mentira que deja en C:\tickets\salida.prn lo que recibe,
  # y corre test/windows/windows_raw_printer_real_test.dart contra ella.
  # En el log, las líneas que empiezan por "IMPRESION-WINDOWS |" traen los
  # tiempos (directo vs PowerShell).
  probar-impresion:
    if: ${{ inputs.probar_impresion }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BAUDEX_PRUEBA_IMPRESORA: BaudexPrueba
      BAUDEX_PRUEBA_SALIDA: C:\tickets\salida.prn
      BAUDEX_PRUEBA_ENVIOS: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Instalar la impresora de mentira (${{ inputs.impresion_puerto }})
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $modo = '${{ inputs.impresion_puerto }}'
          New-Item -ItemType Directory -Force C:\tickets | Out-Null
          icacls C:\tickets /grant 'Everyone:(OI)(CI)F' | Out-Null

          Set-Service -Name Spooler -StartupType Automatic
          if ((Get-Service Spooler).Status -ne 'Running') { Start-Service Spooler }
          Write-Host "Cola de impresión: $((Get-Service Spooler).Status)"

          Add-PrinterDriver -Name 'Generic / Text Only'

          if ($modo -eq 'tcp') {
            # Plan B: puerto TCP RAW 9100 hacia un escucha local que guarda
            # en el archivo de salida cada byte que le llega.
            $escucha = @'
          $salida = 'C:\tickets\salida.prn'
          $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 9100)
          $l.Start()
          while ($true) {
            $c = $l.AcceptTcpClient()
            try {
              $s = $c.GetStream()
              $buf = New-Object byte[] 65536
              while (($n = $s.Read($buf, 0, $buf.Length)) -gt 0) {
                for ($i = 0; $i -lt 100; $i++) {
                  try {
                    $f = [System.IO.File]::Open($salida, 'Append', 'Write', 'ReadWrite, Delete')
                    $f.Write($buf, 0, $n); $f.Close(); break
                  } catch { Start-Sleep -Milliseconds 20 }
                }
              }
            } catch { } finally { $c.Close() }
          }
          '@
            Set-Content -Path C:\tickets\escucha.ps1 -Value $escucha -Encoding UTF8
            Start-Process powershell -WindowStyle Hidden -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'C:\tickets\escucha.ps1'
            Start-Sleep -Seconds 2
            if (-not (Test-NetConnection 127.0.0.1 -Port 9100 -InformationLevel Quiet)) {
              throw 'El escucha del puerto 9100 no arrancó'
            }
            Add-PrinterPort -Name 'BaudexTcp9100' -PrinterHostAddress '127.0.0.1' -PortNumber 9100
            $puerto = 'BaudexTcp9100'
          } else {
            # Puerto local a archivo: la cola escribe ahí lo que se imprime.
            Add-PrinterPort -Name 'C:\tickets\salida.prn'
            $puerto = 'C:\tickets\salida.prn'
          }

          Add-Printer -Name $env:BAUDEX_PRUEBA_IMPRESORA -DriverName 'Generic / Text Only' -PortName $puerto
          Get-Printer | Format-Table Name, DriverName, PortName, PrinterStatus

      - name: Crear .env de relleno (igual que compilar-windows.bat)
        shell: pwsh
        run: |
          $c = @(
            'SERVER_IP=baudex.baudity.tech',
            'SERVER_PORT=443',
            'APP_ENV=production',
            'API_TIMEOUT=30000',
            'DEBUG_MODE=false',
            'SHOW_LOGS=false'
          ) -join "`n"
          foreach ($f in '.env', '.env.production', '.env.development', '.env.staging') {
            Set-Content -Path $f -Value $c -NoNewline -Encoding utf8NoBOM
          }

      - run: flutter pub get

      - name: Envío directo en Windows real
        run: flutter test test/windows/windows_raw_printer_real_test.dart --reporter expanded

      - name: Pruebas unitarias de impresión
        if: ${{ !cancelled() }}
        run: flutter test test/unit/core/printing test/unit/features/invoices/thermal_print_flow_test.dart test/unit/features/invoices/invoice_entry_metrics_test.dart

      - name: Estado de la cola (para diagnosticar)
        if: ${{ always() }}
        shell: powershell
        run: |
          Get-Printer | Format-Table Name, DriverName, PortName, PrinterStatus, JobCount
          Get-PrintJob -PrinterName $env:BAUDEX_PRUEBA_IMPRESORA -ErrorAction SilentlyContinue | Format-Table Id, JobStatus, Size, DocumentName
          Get-ChildItem C:\tickets -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime

  # Recorre en un Windows real lo que hace un cajero con las impresoras:
  # compila en release tool/probes/impresoras_windows_probe.dart y la corre
  # con una base temporal, un servidor de mentira y la impresora de mentira
  # BaudexPrueba (lo que recibe queda en C:\tickets\salida.prn). Antes de
  # empezar daña a propósito shared_preferences.json de ESE equipo de
  # pruebas, para comprobar que agregar/eliminar no dependen de él.
  # En el log: líneas "PRUEBA IMPRESORAS | paso | OK/FALLA".
  probar-impresoras:
    if: ${{ inputs.probar_impresoras }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      BAUDEX_PRUEBA_IMPRESORA: BaudexPrueba
      BAUDEX_PRUEBA_SALIDA: C:\tickets\salida.prn
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Instalar la impresora de mentira (puerto a archivo)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force C:\tickets | Out-Null
          icacls C:\tickets /grant 'Everyone:(OI)(CI)F' | Out-Null
          Set-Service -Name Spooler -StartupType Automatic
          if ((Get-Service Spooler).Status -ne 'Running') { Start-Service Spooler }
          Add-PrinterDriver -Name 'Generic / Text Only'
          Add-PrinterPort -Name 'C:\tickets\salida.prn'
          Add-Printer -Name $env:BAUDEX_PRUEBA_IMPRESORA -DriverName 'Generic / Text Only' -PortName 'C:\tickets\salida.prn'
          Get-Printer | Format-Table Name, DriverName, PortName, PrinterStatus

      - name: Crear .env de relleno (igual que compilar-windows.bat)
        shell: pwsh
        run: |
          $c = @(
            'SERVER_IP=baudex.baudity.tech',
            'SERVER_PORT=443',
            'APP_ENV=production',
            'API_TIMEOUT=30000',
            'DEBUG_MODE=false',
            'SHOW_LOGS=false'
          ) -join "`n"
          foreach ($f in '.env', '.env.production', '.env.development', '.env.staging') {
            Set-Content -Path $f -Value $c -NoNewline -Encoding utf8NoBOM
          }

      - run: flutter pub get

      # En el runner de Windows estas pruebas se quedaron colgadas 24 min
      # (2026-11-26): tope corto y que no impidan la prueba real de abajo.
      - name: Pruebas de impresoras (reglas, base con restos, pantalla)
        timeout-minutes: 8
        continue-on-error: true
        run: flutter test --timeout 120s test/unit/features/settings test/widget/settings test/probes/impresoras_probe_test.dart

      - name: Compilar la app de prueba (release)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          flutter build windows --release -t tool/probes/impresoras_windows_probe.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probar impresoras en Windows real
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # El archivo de la prueba está en UTF-8: que la consola lo muestre
          # igual (si no, los acentos salen rotos en el log).
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $exe = 'build\windows\x64\runner\Release\Baudex.exe'
          New-Item -ItemType Directory -Force C:\impresoras | Out-Null
          $salida = 'C:\impresoras\impresoras.txt'
          $env:BAUDEX_PROBE_OUT = $salida
          $env:BAUDEX_PROBE_CORRUPT_PREFS = '1'
          $env:BAUDEX_PROBE_LABEL = "$env:GITHUB_SHA".Substring(0, 7)
          $p = Start-Process -FilePath $exe -PassThru
          $termino = $p.WaitForExit(10 * 60 * 1000)
          if (-not $termino) { $p.Kill() }
          if (Test-Path $salida) { Get-Content $salida -Encoding utf8 } else { Write-Host 'PRUEBA IMPRESORAS | sin archivo de salida' }
          Write-Host "Código de salida: $($p.ExitCode)"
          if (-not $termino) {
            Write-Host '::error::La app de prueba de impresoras no terminó'
            exit 1
          }
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::Impresoras no cumple (ver líneas 'PRUEBA IMPRESORAS | ... | FALLA')"
            exit 1
          }

      - name: Estado de la cola (para diagnosticar)
        if: ${{ always() }}
        shell: powershell
        run: |
          Get-Printer | Format-Table Name, DriverName, PortName, PrinterStatus, JobCount
          Get-ChildItem C:\tickets -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: prueba-impresoras
          path: C:\impresoras\*.txt
          if-no-files-found: warn

  # Preferencias del equipo (shared_preferences.json): compila en release
  # tool/probes/prefs_windows_probe.dart, que lanza procesos que escriben
  # 200 preferencias a la vez y los mata a mitad, varias veces, con el
  # complemento original (para demostrar que deja el archivo ilegible) y
  # con el almacén propio (que nunca debe perder lo guardado); y comprueba
  # que un archivo dañado al arrancar se restaura de la copia.
  # En el log: líneas "PRUEBA PREFERENCIAS | ...".
  probar-preferencias:
    if: ${{ inputs.probar_preferencias }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Crear .env de relleno (igual que compilar-windows.bat)
        shell: pwsh
        run: |
          $c = @(
            'SERVER_IP=baudex.baudity.tech',
            'SERVER_PORT=443',
            'APP_ENV=production',
            'API_TIMEOUT=30000',
            'DEBUG_MODE=false',
            'SHOW_LOGS=false'
          ) -join "`n"
          foreach ($f in '.env', '.env.production', '.env.development', '.env.staging') {
            Set-Content -Path $f -Value $c -NoNewline -Encoding utf8NoBOM
          }

      - run: flutter pub get

      - name: Pruebas del almacén de preferencias
        timeout-minutes: 8
        run: flutter test --timeout 120s test/unit/core/storage

      - name: Compilar la app de prueba (release)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          flutter build windows --release -t tool/probes/prefs_windows_probe.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probar preferencias en Windows real
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $exe = 'build\windows\x64\runner\Release\Baudex.exe'
          $dir = 'C:\preferencias'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dir | Out-Null
          $env:BAUDEX_PREFS_PROBE_DIR = $dir
          $env:BAUDEX_PROBE_OUT = "$dir\preferencias.txt"
          $azar = [System.Random]::new(7)
          # Baudex solo deja abrir una copia a la vez: se abre, se mata y se
          # revisa, de una en una.
          foreach ($almacen in 'original', 'nuevo') {
            $env:BAUDEX_PREFS_PROBE_STORE = $almacen
            for ($i = 1; $i -le 12; $i++) {
              $env:BAUDEX_PREFS_PROBE_MODE = 'escribir'
              $p = Start-Process -FilePath $exe -PassThru
              Start-Sleep -Milliseconds (4000 + $azar.Next(4000))
              $vivo = -not $p.HasExited
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $p.WaitForExit(20000) | Out-Null
              if (-not $vivo) { Write-Host "PRUEBA PREFERENCIAS | aviso | $almacen vuelta ${i}: el escritor ya se había cerrado solo (código $($p.ExitCode))" }
              Start-Sleep -Milliseconds 500
              $env:BAUDEX_PREFS_PROBE_MODE = 'revisar'
              $r = Start-Process -FilePath $exe -PassThru
              if (-not $r.WaitForExit(60000)) { $r.Kill() }
            }
          }
          $env:BAUDEX_PREFS_PROBE_MODE = ''
          $f = Start-Process -FilePath $exe -PassThru
          $termino = $f.WaitForExit(6 * 60 * 1000)
          if (-not $termino) { $f.Kill() }
          Write-Host '--- conteo por vuelta (almacén|resultado|tanda prometida|detalle) ---'
          if (Test-Path "$dir\conteo.txt") { Get-Content "$dir\conteo.txt" -Encoding utf8 }
          Write-Host '--- resultado ---'
          if (Test-Path $env:BAUDEX_PROBE_OUT) { Get-Content $env:BAUDEX_PROBE_OUT -Encoding utf8 } else { Write-Host 'PRUEBA PREFERENCIAS | sin archivo de salida' }
          Write-Host "Código de salida: $($f.ExitCode)"
          if (-not $termino -or $f.ExitCode -ne 0) {
            Write-Host "::error::Preferencias no cumple (ver líneas 'PRUEBA PREFERENCIAS | ... | FALLA')"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: prueba-preferencias
          path: |
            C:\preferencias\preferencias.txt
            C:\preferencias\conteo.txt
            C:\preferencias\errores.txt
          if-no-files-found: warn

  # Comprueba en un Windows limpio que clonar + doble clic en
  # compilar-windows.bat produce el instalador.
  probar-script:
    if: ${{ inputs.probar_script }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true
      - shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - shell: cmd
        run: compilar-windows.bat
      - shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          if (-not (Get-ChildItem dist\Baudex-Setup-*.exe)) { exit 1 }

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Visual Studio 18 rompe plugins que aún usan <experimental/coroutine>
      # (pasó con Food el 2026-11-18). Esta bandera lo deja compilar.
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      OPS_KEY: ${{ secrets.OPS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Versión
        id: ver
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($v)) {
            $line = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0]
            $v = $line.Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $v"

      - name: Crear .env de producción (sin secretos)
        shell: pwsh
        run: |
          $c = @(
            'SERVER_IP=baudex.baudity.tech',
            'SERVER_PORT=443',
            'APP_ENV=production',
            'API_TIMEOUT=30000',
            'DEBUG_MODE=false',
            'SHOW_LOGS=false'
          ) -join "`n"
          foreach ($f in '.env', '.env.production', '.env.development', '.env.staging') {
            Set-Content -Path $f -Value $c -NoNewline -Encoding utf8NoBOM
          }

      - run: flutter pub get

      - name: Compilar
        shell: pwsh
        run: |
          $fa = @('build', 'windows', '--release', '--dart-define=FLAVOR=production')
          if ($env:OPS_KEY) {
            $fa += '--dart-define=OPS_URL=https://ops.baudity.tech'
            $fa += "--dart-define=OPS_KEY=$env:OPS_KEY"
            Write-Host 'Ops API: activada'
          } else {
            Write-Host '::warning::Sin secreto OPS_KEY: esta compilación no reporta errores a la Ops API'
          }
          flutter @fa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Instalar Inno Setup si falta
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Empaquetar
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" windows\installer\baudex.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\Baudex-windows-$v.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: baudex-windows-${{ steps.ver.outputs.version }}
          path: dist/*
          retention-days: 30
